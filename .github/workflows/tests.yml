name: API Tests CI

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Копируем репозиторий
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests allure-pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Запуск тестов
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          pytest -v --alluredir=./allure-results
        continue-on-error: true

      - name: Получаем историю прогонов
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-history
        continue-on-error: true

      - name: Устанавливаем Allure CLI
        if: always()
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure.tgz -C /opt/
          ln -s /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Генерируем Allure отчет
        if: always()
        run: |
          # Подкладываем историю для трендов, если она скачалась
          if [ -d "allure-history/history" ]; then
            cp -r allure-history/history allure-results/ || true
          fi
          # Генерируем HTML (флаг -c очищает старую папку отчёта)
          allure generate allure-results -c -o allure-report

      - name: Готовим историю для следующего прогона
        if: always()
        run: |
          mkdir -p allure-history
          cp -r allure-report/history allure-history/ || true

      - name: Сохраняем историю как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-history
          retention-days: 5

      - name: Подготовка Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Подготовка artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './allure-report'

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Выводим ссылку на отчёт
        if: always()
        run: |
          PAGE_URL="https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})/"
          echo "## 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Отчёт доступен по ссылке:** [Открыть Allure Report]($PAGE_URL)" >> $GITHUB_STEP_SUMMARY